# OPCIONAL. Antes de que cargue el JavaScript, el HTML inicial de Streamlit
# trae <title>Streamlit</title> y su favicon; la app los reemplaza un instante
# después. Para que nunca se vea la marca, añade esto dentro del bloque
# `location /` que ya hace proxy a http://127.0.0.1:8501 (sin tocar las
# cabeceras de WebSocket que ya tengas):

    proxy_set_header Accept-Encoding "";   # sub_filter necesita la respuesta sin comprimir
    sub_filter_once on;
    sub_filter '<title>Streamlit</title>' '<title>today</title>';
    sub_filter './favicon.png' './app/static/favicon.png';

# Y, si quieres también el favicon desde el arranque, copia el icono a una ruta
# que Nginx pueda leer y sírvelo antes del proxy:
#
#   sudo install -D -m 0644 /home/ubuntu/Developer/today/src/web_app/ui/favicon.png /var/www/today/favicon.png
#
#   location = /app/static/favicon.png {
#       alias /var/www/today/favicon.png;
#   }
#
# Comprueba con `sudo nginx -t` y recarga con `sudo systemctl reload nginx`.
